services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: saas
    ports:
      - '${POSTGRES_HOST_PORT:-5440}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d saas']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # One-off job: applies migrations and seeds plans, then exits.
  migrate:
    build:
      context: .
      target: build
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/saas
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      # Overrides for running inside the container network, as a production build.
      NODE_ENV: production
      DATABASE_URL: postgresql://app:app@postgres:5432/saas
      SECRETS_SOURCE: local
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
